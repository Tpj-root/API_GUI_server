
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Math API</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 24px;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #cbd5e1;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .status {
      background: white;
      border: 1px solid #dbeafe;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      padding: 20px;
      border: 1px solid #dbeafe;
      border-radius: 12px;
      box-shadow: 0 3px 10px #0f172a08;
    }

    .card h2 {
      font-size: 19px;
      margin: 0 0 16px;
    }

    label {
      display: block;
      font-size: 13px;
      margin: 12px 0 6px;
      color: #475569;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #93c5fd;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 11px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 12px;
      padding: 11px;
      border-radius: 7px;
      background: #f1f5f9;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .result.success {
      background: #dcfce7;
      color: #166534;
    }

    .result.error {
      background: #fee2e2;
      color: #991b1b;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <header>
    <h1>🧮 My Math API</h1>
    <p>Local calculator powered by your own Express API</p>
  </header>

  <main>
    <div class="status">
      <strong>API endpoint:</strong>
      <code>/api/calculate</code>
      <span id="status"> — Connecting...</span>
    </div>

    <div class="grid" id="calculators"></div>
  </main>

  <footer>
    Node.js · Express · JavaScript Math Library
  </footer>

  <script>
    const functions = [
      { name: "Add",       op: "add",  symbol: "+",  binary: true },
      { name: "Subtract",  op: "sub",  symbol: "−",  binary: true },
      { name: "Multiply",  op: "mul",  symbol: "×",  binary: true },
      { name: "Divide",    op: "div",  symbol: "÷",  binary: true },
      { name: "Square Root", op: "sqrt", symbol: "√", binary: false },
      { name: "Power",     op: "pow",  symbol: "xʸ", binary: true },
      { name: "Sine",      op: "sin",  symbol: "sin", binary: false },
      { name: "Cosine",    op: "cos",  symbol: "cos", binary: false },
      { name: "Tangent",   op: "tan",  symbol: "tan", binary: false },
      { name: "Absolute",  op: "abs",  symbol: "|x|", binary: false }
    ];

    const container = document.getElementById("calculators");

    // Build all calculator cards automatically.
    for (const fn of functions) {
      const card = document.createElement("section");
      card.className = "card";

      card.innerHTML = `
        <h2>${fn.symbol} ${fn.name}</h2>

        <form>
          <label for="${fn.op}-a">Input a</label>
          <input
            id="${fn.op}-a"
            name="a"
            type="number"
            step="any"
            placeholder="Enter number"
            required
          >

          ${fn.binary ? `
            <label for="${fn.op}-b">Input b</label>
            <input
              id="${fn.op}-b"
              name="b"
              type="number"
              step="any"
              placeholder="Enter number"
              required
            >
          ` : ""}

          <button type="submit">Calculate</button>

          <div class="result" aria-live="polite">
            Result will appear here
          </div>
        </form>
      `;

      const form = card.querySelector("form");
      const resultBox = card.querySelector(".result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const aInput = form.elements.a;
        const bInput = form.elements.b;

        const a = Number(aInput.value);
        const b = fn.binary ? Number(bInput.value) : undefined;

        resultBox.className = "result";
        resultBox.textContent = "Calculating...";

        try {
          const response = await fetch("/api/calculate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              operation: fn.op,
              a,
              ...(fn.binary ? { b } : {})
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Calculation failed");
          }

          resultBox.className = "result success";
          resultBox.textContent =
            `Result: ${data.result}`;

        } catch (error) {
          resultBox.className = "result error";
          resultBox.textContent = `Error: ${error.message}`;
        }
      });

      container.appendChild(card);
    }

    // Check whether the API server is reachable.
    fetch("/api")
      .then(response => {
        if (!response.ok) throw new Error("API unavailable");
        return response.json();
      })
      .then(data => {
        document.getElementById("status").textContent =
          ` — Online (${data.functions.length} functions)`;
      })
      .catch(() => {
        document.getElementById("status").textContent =
          " — Connection failed";
      });
  </script>
</body>
</html>
